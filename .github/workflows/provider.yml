name: Provider CI (UserService)
on:
  push:
    paths: ["provider/**", ".github/workflows/provider.yml"]
  workflow_dispatch:

jobs:
  provider:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: provider
    env:
      PACT_BROKER_BASE_URL: http://localhost:9292
      GIT_COMMIT: ${{ github.sha }}
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install

      - name: 1. Verify contracts and publish results to Broker
        run: npm test

      # always() so the gate still runs and visibly BLOCKS when verification fails
      - name: 2. Can I deploy UserService?
        if: always()
        run: >
          npx pact-broker can-i-deploy
          --pacticipant UserService
          --version $GIT_COMMIT
          --to-environment production

      - name: 3. Record deployment
        if: github.ref == 'refs/heads/main'
        run: >
          npx pact-broker record-deployment
          --pacticipant UserService
          --version $GIT_COMMIT
          --environment production
